<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tahaefe - Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --cream: #f5f0e8;
        --dark:  #1a1510;
        --gold:  #b89a6a;
        --gold2: #d4b896;
        --tv:    #050505;
        --tv-acc:#00FFC2;
      }

      body {
        background-color: var(--tv);
        color: #f0f0f8;
        overflow-x: hidden;
      }

      #selector {
        position: fixed;
        inset: 0;
        display: flex;
        z-index: 9999;
        font-family: 'Montserrat', sans-serif;
        overflow: hidden;
      }

      /* SPLIT SIDES */
      .side {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: flex .6s cubic-bezier(.77,0,.18,1);
      }
      .side::after {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity .4s;
        pointer-events: none;
      }
      .side:hover { flex: 1.35; }
      .side:hover::after { opacity: 1; }

      /* WEB SIDE */
      #side-web {
        background: var(--cream);
        border-right: 1px solid rgba(184,154,106,.3);
      }
      #side-web::after {
        background: radial-gradient(ellipse at center, rgba(184,154,106,.15) 0%, transparent 70%);
      }
      #side-web .icon { font-size: 56px; filter: grayscale(.2); }
      #side-web .label {
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(22px, 3vw, 36px);
        font-weight: 300;
        color: var(--dark);
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      #side-web .sub {
        font-size: 11px;
        letter-spacing: 3px;
        color: var(--gold);
        text-transform: uppercase;
      }
      #side-web .pill {
        border: 1px solid var(--gold);
        color: var(--gold);
        padding: 10px 28px;
        border-radius: 0;
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
        transition: background .3s, color .3s;
        margin-top: 8px;
      }
      #side-web:hover .pill { background: var(--gold); color: var(--cream); }

      /* TV SIDE */
      #side-tv {
        background: var(--tv);
      }
      #side-tv::after {
        background: radial-gradient(ellipse at center, rgba(0,255,194,.12) 0%, transparent 70%);
      }
      #side-tv .icon { font-size: 56px; }
      #side-tv .label {
        font-family: 'Montserrat', sans-serif;
        font-size: clamp(18px, 2.5vw, 30px);
        font-weight: 900;
        color: #fff;
        letter-spacing: 6px;
        text-transform: uppercase;
      }
      #side-tv .sub {
        font-size: 11px;
        letter-spacing: 3px;
        color: var(--tv-acc);
        text-transform: uppercase;
      }
      #side-tv .pill {
        background: var(--tv-acc);
        color: #000;
        padding: 10px 28px;
        border-radius: 24px;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        transition: background .3s, transform .2s, box-shadow .3s;
        margin-top: 8px;
        border: none;
        box-shadow: 0 0 15px rgba(0,255,194,0.3);
      }
      #side-tv:hover .pill {
        background: #00ffc2;
        box-shadow: 0 0 25px rgba(0,255,194,0.6);
        transform: scale(1.05);
      }

      .divider {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 48px;
        height: 48px;
        background: #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 500;
        color: var(--dark);
        letter-spacing: 1px;
        box-shadow: 0 4px 24px rgba(0,0,0,.18);
        z-index: 10;
        pointer-events: none;
        font-family: 'Montserrat', sans-serif;
      }

      #side-web .deco {
        position: absolute;
        top: 30px; left: 30px;
        width: 60px; height: 60px;
        border-top: 1px solid var(--gold2);
        border-left: 1px solid var(--gold2);
        opacity: .5;
      }
      #side-web .deco2 {
        position: absolute;
        bottom: 30px; right: 30px;
        width: 60px; height: 60px;
        border-bottom: 1px solid var(--gold2);
        border-right: 1px solid var(--gold2);
        opacity: .5;
      }

      #side-tv .scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0,0,0,.08) 2px,
          rgba(0,0,0,.08) 4px
        );
        pointer-events: none;
      }

      #selector.fade-out {
        animation: fadeOut .5s forwards;
      }
      @keyframes fadeOut {
        to { opacity: 0; pointer-events: none; }
      }

      .hint {
        position: absolute;
        bottom: 24px;
        font-size: 10px;
        letter-spacing: 2px;
        opacity: .35;
        text-transform: uppercase;
      }
      #side-web .hint { color: var(--dark); }
      #side-tv .hint  { color: #fff; }
    </style>
    <script type="module" crossorigin src="./assets/index-CUTbvEf5.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B6c_YorW.css">
  </head>
  <body>
    <!-- SELECTOR OVERLAY -->
    <div id="selector">
      <!-- WEB SİTESİ -->
      <div class="side" id="side-web" onclick="goWeb()">
        <div class="deco"></div>
        <div class="deco2"></div>
        <div class="icon">🌸</div>
        <div class="label">Dermo Denlife</div>
        <div class="sub">Estetik & Güzellik Salonu</div>
        <div class="pill">Web Sitesine Git</div>
        <div class="hint">Randevu • Hizmetler • İletişim</div>
      </div>

      <div class="divider">veya</div>

      <!-- IPTV -->
      <div class="side" id="side-tv" onclick="goIPTV()">
        <div class="scanlines"></div>
        <div class="icon">📺</div>
        <div class="label">IPTV WEB Pro</div>
        <div class="sub">Canlı Yayın Platformu</div>
        <div class="pill">IPTV'ye Git</div>
        <div class="hint">M3U • HLS • Canlı Kanal</div>
      </div>
    </div>

    <!-- REACT ROOT -->
    <div id="root"></div>


    <script>
      function goWeb() {
        const sel = document.getElementById('selector');
        sel.classList.add('fade-out');
        setTimeout(() => {
          window.location.href = 'https://tahaefe.com.tr';
        }, 400);
      }

      function goIPTV() {
        const sel = document.getElementById('selector');
        sel.classList.add('fade-out');
        setTimeout(() => {
          sel.remove();
        }, 500);
      }
    </script>
  </body>
</html>
